<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exibição em Tela Cheia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    
    .slider-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Botão flutuante para acessar o Painel de Administração */
    .btn-admin {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      opacity: 0.3;
    }

    .btn-admin:hover {
      opacity: 1;
      background-color: rgba(0, 0, 0, 0.85);
      border-color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <a href="/admin" class="btn-admin">⚙️ Painel Admin</a>

  <div class="slider-container" id="slider"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const slider = document.getElementById('slider');
    let currentIndex = 0;
    let slideInterval;

    socket.on('loadImages', (images) => {
      slider.innerHTML = '';
      if (images.length === 0) return;

      images.forEach((url, index) => {
        const img = document.createElement('img');
        img.src = url;
        img.classList.add('slide');
        if (index === 0) img.classList.add('active');
        slider.appendChild(img);
      });

      clearInterval(slideInterval);
      currentIndex = 0;

      if (images.length > 1) {
        slideInterval = setInterval(() => {
          const slides = document.querySelectorAll('.slide');
          if (slides.length > 0) {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
          }
        }, 15000); // <-- Alterado para 15000ms (15 segundos)
      }
    });
  </script>
</body>
</html>
